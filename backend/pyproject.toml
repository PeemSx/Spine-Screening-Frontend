[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "core", "models", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=app --cov=core --maxfail=1 --disable-warnings"
testpaths = ["tests"]
